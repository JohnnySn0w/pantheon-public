# Pantheon naming-history registry — canonical old→new resolver.
#
# T-3815 (2026-09-19, self-filed) per the operator TG 10145: "in order to ease tickets
# over, a mapping should track old names for things in general." Machine-queryable
# forward-resolution surface for renames that would otherwise stay as ad-hoc
# per-namespace continuity (agent_role_map backward-resolve, per-rename lessons
# entries). Historical audit-chain surfaces (ledger, tickets, notes) stay
# immutable per P4; this registry is a READ-time resolver over them, not a
# rewrite.
#
# Schema per entry:
#   old:            string, the retired name (byte-exact match)
#   new:            string, the current canonical name (or the literal string
#                   "retired" for retirements that map to nothing)
#   kind:           one of: role_id, role_key, persona, instance, agent_id
#                   (extensible; add here + in tools/naming_history.py first)
#   retired_date:   YYYY-MM-DD, calendar date the rename ratified
#   ratified_by:    ticket_id (T-NNNN) or ADR id (ORG-NNN); the authority
#   scope:          one-line prose scoping which manifestation sites the
#                   rename covers (for readers; not machine-consumed)
#
# Write discipline: every ratified rename appends an entry as part of the rename
# ticket's closure. Historical (pre-registry) renames back-filled from ledger
# review or opportunistic — not urgent.
#
# Consumers: tools/naming_history.py (the resolver) is the canonical read path.
# Other callers (ticket.py resolvers, ledger writers, doc-search) may embed
# lookups via that module; not by re-reading this file directly.

schema_version: 1

entries:
