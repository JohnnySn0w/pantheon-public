# Role-delta content — T-3339 Phase 1.
#
# Per-role body content composed on top of manifest.yaml's base_layer for
# that role's spawn. Sibling of manifest.yaml; D2-protected; hand-curated,
# NOT renderer-written (contrast with source-bindings.yaml).
#
# Each `roles.<role>.<delta_section>` value is either:
#   - a single extract-descriptor dict (`{extract: ..., source: ..., ...}`
#     or `{extract: inline, body: ...}`), or
#   - a LIST of such descriptors, rendered in order and joined with a blank
#     line between parts (used when a delta needs both a stamped-source
#     excerpt AND inline commentary, e.g. project_orchestrator's
#     chain_of_justification below).
#
# Consultant roles (consultant_worker, consultant_reviewer, consultant_temp_backup_orchestrator)
# are declared in manifest.yaml's roles list but intentionally have NO entry
# here — Phase 5 gates on the T-3333 charter ruling. Do not populate.

version: 1

roles:
  implementer:
    plan_first:
      extract: heading-region
      source: rulebook/directives.md
      heading: "## D6 — Plan-first protocol + locked-answer-deviation handling"
    testing_depth:
      extract: heading-region
      source: sop/standard/testing-depth-and-scope.md
      heading: "## When to use this"
    code_size_norms_body:
      extract: full-file
      source: rulebook/policies/code-size-norms.md
    five_phase_signatures_first:
      extract: inline
      body: |
        Five-phase signatures-first methodology (memory pin
        `feedback_implementer_methodology_signatures_first.md`): plan ->
        stubs -> tests -> code -> smoke. Return the plan first (this
        section) and stop for approval; after approval, write function/method
        SIGNATURES before bodies so the shape of the change is visible before
        the logic is; write the FAILING test next (TDD is non-negotiable for
        new behavior) and confirm it fails for the expected reason; then the
        minimal implementation; then run the project's smoke loop. Not
        sha-stamped — no ratified rulebook/sop source exists yet for this
        specific five-phase framing; the text above restates the memory pin,
        it does not invent new content.
    worktree_stash_hygiene:
      extract: heading-region
      source: sop/standard/pre-implementation-reviewer-discipline.md
      heading: "## Worktree git-hygiene: never bare `git stash` (it is repo-wide, not worktree-scoped)"

  reviewer:
    preimplementation:
      extract: full-file
      source: sop/standard/pre-implementation-reviewer-discipline.md
    codex_spec_review:
      extract: full-file
      source: sop/standard/codex-planning-spec-review.md
    review_methodologies:
      extract: full-file
      source: sop/standard/reviewer-methodologies.md

  project_orchestrator:
    team_checklist:
      extract: heading-region
      source: sop/standard/team-orchestrator-dispatch-checklist.md
      heading: "## Pre-dispatch checklist"
    brief_construction:
      extract: heading-region
      source: sop/standard/team-orchestrator-brief-construction.md
      heading: "## Canonical structure"
    worker_silence_liveness:
      extract: full-file
      source: sop/standard/dispatch-and-wait-liveness.md
    chain_of_justification:
      - extract: heading-region
        source: rulebook/principles.md
        heading: "## P3 — Decisions justify upward"
      # The former inline text + FIX-SOON (no repo-stampable home for the
      # operational rule) is resolved by T-2892: the operational form now
      # lives in sop/standard/orchestrator-standing-rules.md.
      - extract: heading-region
        source: sop/standard/orchestrator-standing-rules.md
        heading: "## Chain of justification"

  # T-2892 (ORG-075 D2/E2 deliverable b): the seat-loadable HO playbook for
  # mason + artisan (persona_roles.yaml: engineering_orchestrator). Precision
  # over bulk — team mechanics stay in pantheon-role-project-orchestrator,
  # which the standing-rules SOP tells a seat to load when it runs a team.
  engineering_orchestrator:
    standing_rules:
      extract: full-file
      source: sop/standard/orchestrator-standing-rules.md
    autonomy_calibration:
      extract: heading-region
      source: rulebook/policies/trust-posture.md
      heading: "## Act-vs-park calibration — the deferred-judgment reframe (amendment, Ratified 2026-06-10 by the operator, Telegram 3096)"
    ticket_routing:
      extract: heading-region
      source: sop/standard/ticket-flow.md
      heading: "## The load-bearing rule: who claims what"
    push_merge_boundary:
      extract: heading-region
      source: sop/standard/retask-dispatch.md
      heading: "## Push/merge boundary"

  head_engineering_orchestrator:
    autonomy_calibration:
      extract: heading-region
      source: rulebook/policies/trust-posture.md
      heading: "## Act-vs-park calibration — the deferred-judgment reframe (amendment, Ratified 2026-06-10 by the operator, Telegram 3096)"
    ticket_routing:
      extract: heading-region
      source: sop/standard/ticket-flow.md
      heading: "## The load-bearing rule: who claims what"
    retask_discipline:
      extract: full-file
      source: sop/standard/retask-dispatch.md
    user_message_closeout:
      extract: full-file
      source: sop/standard/how-to-message-the-org-user.md
    ho_absent_operator:
      extract: full-file
      source: sop/standard/ho-absent-operator-keep-working.md

  research:
    research_standards:
      extract: heading-region
      source: sop/standard/research-dispatch-deliverable-standards.md
      heading: "## When to use this"
    filing_convention:
      extract: full-file
      source: sop/standard/research-dispatch-filing.md
    isolation:
      extract: full-file
      source: sop/standard/web-research-isolation.md
    a2a_shape:
      extract: full-file
      source: sop/standard/a2a-research-request-handling.md

  recovery:
    restart_pattern:
      extract: full-file
      source: sop/standard/handoff-restart-runbook.md
    auto_resume:
      extract: heading-region
      source: sop/standard/auto-resume-operator-runbook.md
      heading: "## What a clean cycle looks like"
    cross_account_ops:
      extract: heading-region
