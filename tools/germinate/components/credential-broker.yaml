# credential-broker component contract (ORG-051, ORG-080 §2; T-5092, germination tranche GG).
#
# Wraps tools/credential_broker.py + tools/credential_broker_cli.py (T-2380,
# T-2868), unchanged, ADOPT-ONLY: the broker's secret-touching installer verbs
# (install / rotate / revoke) are gated stubs pending the T-2869 custody
# decision, so no op here touches credential material. The planner
# (credential-broker.py) plans over HostFileCredentialBroker.verify's own report
# (metadata only), produced by the SIMULATED handler (credential-broker_handlers.py).
# No live handler exists; nothing here actuates a host (HO ask boundary on T-5092).
#
# * install: observe-and-attest (T-5947): one credential-broker.adopt-attest op
#   binding the verify evidence; a matching rerun plans nothing; healthy drift
#   re-attests; any unavailable reference refuses with the CLI's gate message.
# * remove: retires the engine attestation only; revocation stays gated (T-2870).
# * configure, update and repair are not declared (leg-not-declared).
component:
  id: credential-broker
  steward: codex
  version: 1
  planner_kind: python
  contract_digest: sha256:afdcf064acf4c868910bc4685fc9d008ceff0302444aa65d6c062dec08b01b90
  handlers_digest: sha256:60d00cb3355d8cfd66c51be009a90163a2ceec18b53ac3b3a405104eefba21d5
  depends_on: []
  scopes: [system]
  privilege:
    seat: [credential-broker.adopt-attest, credential-broker.attest-retire]
  legs:
    install: plan_install
    remove: plan_remove
  receipts:
    schema: pantheon-receipt/v1
