# harness-manager component contract (ORG-080 §2, §5; T-5090, germination tranche GF1).
#
# The UNPRIVILEGED half only:
# * verify: ONE invariant_list_ref (ORG-080 A-6) resolving ORG-079 V1-V19, the
#   ORG-099 HARD axes, and the ORG-080 §6 monitor invariants, held in
#   harness-manager.invariants.yaml (CURRENT, Recovery-approved, D15) and evaluated by
#   harness_manager_verify.py. Unwired into the engine's `verify` (T-5135).
# * configure sub-op (b), the harness-runtime swap: plan_configure in
#   harness-manager.py, an adapter over persona_bringup.operator_target_swap /
#   runtime_controller._operator_target_swap_resolved; ops run only through the
#   SIMULATED handler in harness-manager_handlers.py.
# * the PersonaController1 emitter binding: the emitter block below is bound to the
#   same list. The live emitter (tools/persona_controller_health_dbus.py) reports
#   against it behind a dark flag (T-5137); sourcing the remaining facts is T-5404.
# * install (T-5091 U1, GF2): plan_install in harness-manager.py, an adapter over
#   the live installer's pure plan (PersonaInstaller.plan with an explicit
#   desired.source_revision), one seat-scope sub-run per seat. Its kinds are the
#   installer's own, already typed-op registry kinds (identity mapping; the 24 seat
#   kinds are listed under privilege.seat, the 12 diagnostics.read kinds need no
#   list). Ops run only through the SIMULATED handlers (HarnessInstallSim plus the
#   engine's InstallerFileHandler for mkdir / atomic-write). Root needs are U2.
#
# STILL DEFERRED in GF2 (T-5091), declared absent so the engine refuses them
# (leg-not-declared): remove (with decommission), configure sub-op (a)
# (supervisor cutover, hence no `supervisor` desired key), update, repair, the
# root privilege list, the necessary external interactions and the other §2 gates.
#
# The authority-transfer gate is independent-agent class as in ORG-080 §2. Grant
# consumption is deferred in the engine (seam gap S2), so applying a real swap
# refuses (grant-required) before any mutation: the swap lands dark.
component:
  id: harness-manager
  steward: orchestrator
  version: 1
  planner_kind: python
  contract_digest: sha256:800d340660c3f7033b4b64721c6cc2bc9f036365381edd266192d7d398b97343
  handlers_digest: sha256:5a3b17be7aae0362e1563a8ea812aa104b917f533b7f02bdc0df44f99b2a8ff9
  depends_on: [host-substrate, mailbox, action-broker, credential-broker]
  scopes: [system, seat]
  desired_schema:
    harness: {enum: [claude, codex]}
    source_revision: {}
  invariant_list_id: org.pantheon.persona-stack/v1
  invariant_list_digest: sha256:4aee6d6777b7f6dd273ea77fa8f88de1f8e61a2f7d33755f34b27ba8cfabd4e4
  privilege:
    seat: [harness.transition-stage, harness.receiver-handoff, harness.runtime-replace, harness.transition-commit,
           atomic-write, claude-mcp-server-registration, codex-standing-instructions-install, codex-telegram-mcp-check,
           codex-telegram-source-check, daemon-reload, direct-fire, mailbox-probe, mailbox-writable-root-check, mkdir,
           seat-claude-settings-env, seat-claude-workspace-trust, seat-periodic-daemon-reload, seat-periodic-timer-enable,
           seat-periodic-timer-observe, seat-periodic-unit-install, seat-runtime-residue-quarantine, seat-service-decommission,
           seat-service-enable-observe, stale-unit-failure-reset, timer-enable, timer-observe, unit-fire, user-unit-install]
  legs:
    install: plan_install
    configure: plan_configure
    verify:
      invariant_list_ref: org.pantheon.persona-stack/v1@sha256:4aee6d6777b7f6dd273ea77fa8f88de1f8e61a2f7d33755f34b27ba8cfabd4e4
  gates:
    - id: authority-transfer
      irreversible: true
      rollback: receiver-restore
      approval:
        class: independent-agent
        grant_source: action-broker-approval-registry
        binds: [actor, performer, target, operation, plan_digest, scope, policy_revision, expiry]
  receipts:
    schema: pantheon-receipt/v1
  emitter:
    bus: session
    interface: org.pantheon.PersonaController1
    invariant_list_ref: org.pantheon.persona-stack/v1@sha256:4aee6d6777b7f6dd273ea77fa8f88de1f8e61a2f7d33755f34b27ba8cfabd4e4
    reports:
      states: [ready, degraded, unhealthy, not_configured, suppressed]
    collector_attachment: required
