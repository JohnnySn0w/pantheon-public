      class: presence-mode
      applies_to: all
      on_fail: degraded
      machine_check: defined
    - id: ORG-079/V6
      source: architecture/adr/ORG-079-l1-install-completeness-contract.md#V6
      text: chronicle/ and agent-state-history/ dirs exist, writable, ownership
      class: presence-mode
      applies_to: all
      on_fail: degraded
      machine_check: defined
    - id: ORG-079/V7
      source: architecture/adr/ORG-079-l1-install-completeness-contract.md#V7
      text: chronicle.py importable + handoff_and_restart.sh executable + the restart hook reaches the pinned executable
      class: trace
