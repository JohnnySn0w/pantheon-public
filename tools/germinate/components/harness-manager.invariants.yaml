      machine_check: ambiguous
    - id: ORG-079/V8
      source: architecture/adr/ORG-079-l1-install-completeness-contract.md#V8
      text: Mailbox path present; canonical mailbox verifier succeeds with the exact manifest-derived ACL
      class: set-compare
      applies_to: all
      on_fail: degraded
      machine_check: defined
      overlaps: [axes.yaml#mailbox-inbox-exists, axes.yaml#mailbox-can-send-to-peers]
    - id: ORG-079/V9
      source: architecture/adr/ORG-079-l1-install-completeness-contract.md#V9
      text: Per-install source snapshot archived; revision + path hashes bound to an operator receipt
      class: receipt-bound
      applies_to: all
      on_fail: degraded
      machine_check: ambiguous
    - id: ORG-079/V10
      source: architecture/adr/ORG-079-l1-install-completeness-contract.md#V10
      text: Apply receipt at persona_installer.convergence_marker.path; immutable, hash-bound, created only after post-apply verify
      class: receipt-bound
      applies_to: all
      on_fail: degraded
      machine_check: ambiguous
    - id: ORG-079/V11
      source: architecture/adr/ORG-079-l1-install-completeness-contract.md#V11
      text: UID-cordon audit CURRENT PASS for the declared blast radius; live uid grants compared at verify time
      class: live-compare
      applies_to: all
      on_fail: unhealthy
      security_drift: true
      machine_check: ambiguous
    - id: ORG-079/V12
      source: architecture/adr/ORG-079-l1-install-completeness-contract.md#V12
      text: autoMemoryDirectory present + writable; native harness config binding present AND target path resolves
      class: trace
      applies_to: all
      on_fail: degraded
      machine_check: ambiguous
    - id: ORG-079/V13
      source: architecture/adr/ORG-079-l1-install-completeness-contract.md#V13
      text: Owned systemd unit bytes + owner + mode match the install-time source snapshot (V9)
      class: receipt-bound
      applies_to: {systemd_runtime: true}
      on_fail: degraded
      machine_check: ambiguous
    - id: ORG-079/V14
      source: architecture/adr/ORG-079-l1-install-completeness-contract.md#V14
      text: daemon-reload ran after unit materialization; last reload result recorded
      class: recorded-probe
      applies_to: {systemd_runtime: true}
