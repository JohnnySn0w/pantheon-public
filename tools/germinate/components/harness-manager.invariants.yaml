# harness-manager invariant list (ORG-080 Amendment A-6; T-5090, germination tranche GF1).
#
# STATUS: CURRENT. Recovery co-authors this list (ORG-080 Build plan (d), D15); her
# review is APPROVED. Derived from the ADR text: ORG-079 "Verification
# contract" V1-V19, ORG-099 §3.1 HARD parity axes (whose machine form is
# sop/standard/seat-parity/axes.yaml), and the two explicit ORG-080 §6 monitor
# invariants. It is the ONE list both `verify` and the PersonaController1 emitter
# report against (ORG-080 §2 invariant_list_id / invariant_list_digest; §6
# touch-point 2). Neither surface keeps a parallel verifier (A-6).
#
# The two ORG-080 monitor entries are contract shape only in GF1. T-5135 owns
# engine verify/evaluator wiring and T-5137 owns live PersonaController1 emitter
# wiring; until those seams land, machine_check is ambiguous and this list makes
# no live-coverage claim.
#
# The digest pinned in harness-manager.yaml is
#   sha256:<hex of canonical_json_bytes(yaml.safe_load(this file))>
# computed by harness_manager_verify.list_digest. Comments are not part of it.
# Nothing in the engine or the ORG-081 validator recomputes it yet (seam gap S4);
# test_list_digest_is_pinned_in_the_contract is the stopgap.
#
# Classes (evaluated by harness_manager_verify.evaluate over observation data):
#   presence-mode   path present + owner + mode (+ no-symlink where named)
#   schema          document is a mapping and carries the required keys
#   set-compare     actual set == expected (manifest-declared) set
#   receipt-bound   evidence hash equals the hash bound in the receipt
#   live-compare    live grants are a subset of the declared envelope
#   trace           a binding chain resolves to its pinned target
#   recorded-probe  a parity check verdict (parity_render vocabulary:
#                   PASS | FAIL | UNMEASURABLE); anything else is an alarm
#   hook-allowlist-parity  supplied hook-symlink and allowlist parity booleans
#   owner-manager-match   supplied configured owner and observed manager identity
# "Could not ask" (no observation, malformed observation, UNMEASURABLE) is an
# ALARM, never a pass (ORG-099 §8).
#
# Overlaps are cross-referenced, not merged (merging is Recovery's call):
#   ORG-079/V8 ~ axes.yaml#mailbox-inbox-exists, axes.yaml#mailbox-can-send-to-peers
#   ORG-079/V1, V4 ~ axes.yaml#harness-cli-installed-authed (config file present)
#   ORG-079/V16 ~ axes.yaml#inbox-consumer-timer-present (one enabled unit)
#
# Ambiguous machine-checks, to send to Recovery (D15) -- verbatim from the T-5090 plan:
# - V3 and V4: the "JSON-wiring schema" is undefined, and V4's path `~/.claude/hooks/settings.json` (ORG-079:155) is probably a typo for `~/.claude/settings.json`.
# - V7: the hook-binding trace.
# - V9 and V10: no operator-receipt or convergence-marker schema or path exists in the manifest.
# - V11: no `uid_cordon` schema or evaluator (it waits on the ORG-063 build).
# - V12: no per-role `autoMemoryDirectory` in the manifest.
# - V13: depends on V9.
# - V14: reload results are never recorded today.
# - V16: no `enabled_units` in the manifest.
# - V18: there is no disabled-first-fire evidence store.
# - V19: the "fully-typed schema" is undefined.
# - HARD `chat-surface-first-live-turn-verified`: verify can only read recorded evidence; a live turn isn't side-effect-free.
# - HARD `delivery-mode-substrate-match` and `permissions-allow-covers-mcp-tools`: their `check_ref` shell semantics need a typed probe.
# - ORG-080 monitor invariants: observation producers are unwired (T-5135 verify;
#   T-5137 emitter), so these entries evaluate supplied facts but do not claim a
#   live machine check.
invariant_list:
  id: org.pantheon.persona-stack/v1
  status: CURRENT
  co_author: recovery
  co_author_review: approved
  sources: [ORG-079, ORG-099, ORG-080]
  invariants:
    - id: ORG-079/V1
      source: architecture/adr/ORG-079-l1-install-completeness-contract.md#V1
      text: Adapter-config-root exists and is a mapping; an mcpServers-equivalent key exists (may be {})
      class: schema
      applies_to: {adapters: [claude]}
      on_fail: degraded
      machine_check: defined
    - id: ORG-079/V2
      source: architecture/adr/ORG-079-l1-install-completeness-contract.md#V2
      text: Adapter skills directory exists (empty legal); ownership + mode match manifest
      class: presence-mode
      applies_to: {adapters: [claude]}
      on_fail: degraded
      machine_check: defined
    - id: ORG-079/V3
      source: architecture/adr/ORG-079-l1-install-completeness-contract.md#V3
      text: Adapter plugin config skeleton present + exact paths + JSON-wiring schema conformance
      class: schema
      applies_to: {adapters: [claude]}
      on_fail: degraded
      machine_check: ambiguous
    - id: ORG-079/V4
      source: architecture/adr/ORG-079-l1-install-completeness-contract.md#V4
