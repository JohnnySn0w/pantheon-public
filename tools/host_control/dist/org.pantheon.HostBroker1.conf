<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  STAGED ARTIFACT (T-2912, ORG-052 Unit 3a) - nothing in this unit
  installs it; placement under /etc/dbus-1/system.d/ is the T-2920
  install leg's.

  DEFAULT-DENY, MEMBER-LEVEL (ORG-052 sections 2/5, gate 10): an
  unlisted member is denied by omission, never by an explicit deny
  list. Bus policy is defence in depth - the broker re-authorizes the
  bus-derived uid on every method server-side; these rules are never
  the perimeter.

  PROVISIONAL account names pending T-2920 ratification:
  pantheon-hostbroker (service account), pantheon-hostapproval
  (approval-service account, T-2913), pantheon-hostmonitor
  (monitor account, T-2943).

  Registered SEAT accounts get their seven Manager members via
  per-seat fragments generated at install time from the root-owned
  seat registry using pantheon-host-broker-seat.conf.template - seat
  uids are dynamic registry data and cannot be enumerated in a static
  file.
-->
<busconfig>
  <policy context="default">
    <deny own="org.pantheon.HostBroker1"/>
    <deny send_destination="org.pantheon.HostBroker1"/>
    <!--
      Health1 push is monitor-only. This deny is sender+type scoped,
      never interface-qualified: D-Bus interface headers are optional,
      so an interface-only deny can be bypassed by omitting the field.
    -->
    <deny receive_sender="org.pantheon.HostBroker1"
          receive_type="signal"/>
  </policy>
  <policy user="pantheon-hostbroker">
    <allow own="org.pantheon.HostBroker1"/>
  </policy>
  <!-- BEGIN T-2914 REMOVABLE MONITOR HEALTH SECTION
       Staged-only static monitor policy. T-2921 remove can delete this
       contiguous section as one block; T-2920 owns installation. -->
  <policy user="pantheon-hostmonitor">
    <allow send_destination="org.pantheon.HostBroker1"
           send_path="/org/pantheon/HostBroker1/Health"
           send_interface="org.freedesktop.DBus.Properties"
           send_member="Get"/>
    <allow send_destination="org.pantheon.HostBroker1"
           send_path="/org/pantheon/HostBroker1/Health"
           send_interface="org.freedesktop.DBus.Properties"
           send_member="GetAll"/>
    <allow receive_sender="org.pantheon.HostBroker1"
           receive_path="/org/pantheon/HostBroker1/Health"
           receive_interface="org.freedesktop.DBus.Properties"
           receive_member="PropertiesChanged"
           receive_type="signal"/>
  </policy>
  <!-- END T-2914 REMOVABLE MONITOR HEALTH SECTION -->
  <policy user="pantheon-hostapproval">
    <allow send_destination="org.pantheon.HostBroker1"
           send_interface="org.pantheon.HostBroker1.ApprovalSource"
           send_member="PlanMetadata"/>
    <allow send_destination="org.pantheon.HostBroker1"
           send_interface="org.pantheon.HostBroker1.ApprovalSource"
           send_member="PlanSummary"/>
  </policy>
</busconfig>
