<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  STAGED ARTIFACT (T-2919, ORG-052 Unit 7) - nothing in this unit
  installs it; placement under /etc/dbus-1/system.d/ is the T-2920
  install leg's.

  DEFAULT-DENY, MEMBER-LEVEL. Exactly one member: Present on
  org.pantheon.HostApprovalTelegram1.Ingress, sendable ONLY by the
  approval-service account. Only the ingress account may own the name.
  No signals are emitted (the ingress object has none). The reverse
  direction - the ingress calling HostApproval1.HumanIngress.HumanDecision -
  is granted (to the ingress account only) by the staged
  org.pantheon.HostApproval1.conf. Bus policy is defence in depth: the
  ingress rechecks the bus-derived caller uid on every Present
  (tools/host_control/telegram_ingress/dbus_service.py).

  PROVISIONAL account names pending T-2920 ratification:
    pantheon-hostapproval-ingress (owner of this name)
    pantheon-hostapproval         (the only permitted Present caller)
-->
<busconfig>
  <policy context="default">
    <deny own="org.pantheon.HostApprovalTelegram1"/>
    <deny send_destination="org.pantheon.HostApprovalTelegram1"/>
    <deny receive_sender="org.pantheon.HostApprovalTelegram1"
          receive_type="signal"/>
  </policy>
  <policy user="pantheon-hostapproval-ingress">
    <allow own="org.pantheon.HostApprovalTelegram1"/>
  </policy>
  <policy user="pantheon-hostapproval">
    <allow send_destination="org.pantheon.HostApprovalTelegram1"
           send_interface="org.pantheon.HostApprovalTelegram1.Ingress"
           send_member="Present"/>
  </policy>
</busconfig>
