<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  STAGED ARTIFACT (T-2913, ORG-052 Unit 3b) - nothing in this unit
  installs it; placement under /etc/dbus-1/system.d/ is the T-2920
  install leg's.

  DEFAULT-DENY, MEMBER-LEVEL (ORG-052 sections 2/5, gate 10): an
  unlisted member is denied by omission, never by an explicit deny
  list. Bus policy is defence in depth - the approval service
  re-authorizes the bus-derived uid on every method server-side
  (per-interface gates in tools/host_control/approval/dbus_service.py);
  these rules are never the perimeter.

  PROVISIONAL account names pending T-2920 ratification:
    pantheon-hostapproval         (approval-service account; reused
                                   from the name the T-2912 broker
                                   policy already introduced)
    pantheon-hostbroker           (broker account - the only permitted
                                   Consumer caller)
    pantheon-hostapproval-ingress (Telegram-ingress account; the
                                   T-2919 ingress service will run as
                                   it - minted here, T-2913)
    pantheon-hostmonitor          (monitor account, T-2943)

  Registered APPROVER accounts get their four Reviewer members via
  per-approver fragments generated at install time from the root-owned
  approver policy using pantheon-host-approval-approver.conf.template -
  approver uids are dynamic policy data and cannot be enumerated in a
  static file (the same shape as the broker's per-seat fragments).
-->
<busconfig>
  <policy context="default">
    <deny own="org.pantheon.HostApproval1"/>
    <deny send_destination="org.pantheon.HostApproval1"/>
    <!--
      Health1 push is monitor-only. This deny is sender+type scoped,
      never interface-qualified: D-Bus interface headers are optional,
      so an interface-only deny can be bypassed by omitting the field.
    -->
    <deny receive_sender="org.pantheon.HostApproval1"
          receive_type="signal"/>
  </policy>
  <policy user="pantheon-hostapproval">
    <allow own="org.pantheon.HostApproval1"/>
  </policy>
  <!-- BEGIN T-2914 REMOVABLE MONITOR HEALTH SECTION
       Staged-only static monitor policy. T-2921 remove can delete this
       contiguous section as one block; T-2920 owns installation. -->
  <policy user="pantheon-hostmonitor">
    <allow send_destination="org.pantheon.HostApproval1"
           send_path="/org/pantheon/HostApproval1/Health"
           send_interface="org.freedesktop.DBus.Properties"
           send_member="Get"/>
    <allow send_destination="org.pantheon.HostApproval1"
           send_path="/org/pantheon/HostApproval1/Health"
           send_interface="org.freedesktop.DBus.Properties"
           send_member="GetAll"/>
    <allow receive_sender="org.pantheon.HostApproval1"
           receive_path="/org/pantheon/HostApproval1/Health"
           receive_interface="org.freedesktop.DBus.Properties"
           receive_member="PropertiesChanged"
           receive_type="signal"/>
  </policy>
  <!-- END T-2914 REMOVABLE MONITOR HEALTH SECTION -->
  <policy user="pantheon-hostbroker">
    <allow send_destination="org.pantheon.HostApproval1"
           send_interface="org.pantheon.HostApproval1.Consumer"
           send_member="ValidateAndBind"/>
    <allow send_destination="org.pantheon.HostApproval1"
           send_interface="org.pantheon.HostApproval1.Consumer"
           send_member="ApprovalStatus"/>
  </policy>
  <policy user="pantheon-hostapproval-ingress">
    <allow send_destination="org.pantheon.HostApproval1"
           send_interface="org.pantheon.HostApproval1.HumanIngress"
           send_member="HumanDecision"/>
  </policy>
</busconfig>
