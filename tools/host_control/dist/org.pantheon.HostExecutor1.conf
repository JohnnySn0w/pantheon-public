<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  STAGED ARTIFACT (T-2917, ORG-052 Unit 5b) - nothing in this unit installs
  it; placement under /etc/dbus-1/system.d/ is the T-2920 install leg's.

  DEFAULT-DENY, MEMBER-LEVEL (ORG-052 sections 2/3, gate 10). Every
  per-seat executor name lives under the org.pantheon.HostExecutor1 prefix
  (org.pantheon.HostExecutor1.U<uid>, ruling i5). Nobody may own or call
  any of them by default; each seat account may own ONLY its own name via
  its per-seat fragment (pantheon-host-executor-seat.conf.template), and
  only the broker account may call Execute / ExecutionGet. Bus policy is
  defence in depth: the executor re-checks in code that the caller is the
  broker uid AND the current owner of org.pantheon.HostBroker1, and the
  broker re-checks the executor name owner's uid against the registry.

  Names PROVISIONAL-PENDING-RATIFICATION (T-2917 ruling i3); the broker
  account name pantheon-hostbroker is PROVISIONAL pending T-2920.
-->
<busconfig>
  <policy context="default">
    <deny own_prefix="org.pantheon.HostExecutor1"/>
    <deny send_destination_prefix="org.pantheon.HostExecutor1"/>
  </policy>
  <policy user="pantheon-hostbroker">
    <allow send_destination_prefix="org.pantheon.HostExecutor1"
           send_interface="org.pantheon.HostExecutor1.Executor"
           send_member="Execute"/>
    <allow send_destination_prefix="org.pantheon.HostExecutor1"
           send_interface="org.pantheon.HostExecutor1.Executor"
           send_member="ExecutionGet"/>
  </policy>
</busconfig>
