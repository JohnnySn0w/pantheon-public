# Pantheon systemd-oomd per-account pressure shedder (T-5157, 2026-10-18).
#
# Applies to every user-<UID>.slice (systemd dash-prefix drop-in). Each account
# slice becomes its own oomd-monitored cgroup with its own candidate list, so a
# kill (and the systemd 255 EINVAL continue-loop, see user.slice.d) stays inside
# the account whose memory PSI crossed DefaultMemoryPressureLimit/DurationSec in
# oomd.conf.d/50-pantheon.conf. These slices are PID1-owned, so registration does
# not depend on each user manager re-registering with oomd (user@.service's own
# ManagedOOMMemoryPressure=kill was registered for only 5 of 10 accounts on
# 10-18). Swap is NOT managed here: oomd pools swap candidates across all
# swap-managed cgroups, which would recreate the cross-account cascade; earlyoom
# is the swap backstop.

[Slice]
ManagedOOMMemoryPressure=kill
