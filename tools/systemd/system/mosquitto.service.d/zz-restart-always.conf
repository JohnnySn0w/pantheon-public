# Pantheon mosquitto: restart a CLEAN exit too (T-5297, 2026-10-20).
# Install: /etc/systemd/system/mosquitto.service.d/zz-restart-always.conf, then
# `systemctl daemon-reload` (no broker restart needed; it takes effect on the next exit).
#
# WHY: at 2026-10-19T01:22:58Z earlyoom SIGTERMed mosquitto (badness 666, VmRSS 3 MiB).
# The broker exits 0 on SIGTERM, so systemd logged "Deactivated successfully", and the
# base unit's Restart=on-failure (and tailscale-ip-wait.conf's) left it down until the
# 20:09Z reboot, 19 h later. Meanwhile echo watchdog-looped about 29 times an hour on a
# refused broker.
#
# Restart=always restarts any exit systemd did not ask for. An explicit
# `systemctl stop` is still honoured. tailscale-ip-wait.conf's StartLimit
# (20 starts / 120 s) is kept, so a broker that keeps failing (e.g. bad config)
# still latches failed instead of spinning. The paired earlyoom --avoid entry
# (tools/systemd/default/earlyoom) stops earlyoom picking the broker in the first place.
# NAME MUST SORT LAST: drop-ins apply in lexical order and the last Restart= wins.
# tailscale-ip-wait.conf also sets Restart=on-failure, so a 50- prefix would lose to it
# (checked: as 50- the effective value is on-failure, as zz- it is always). Verify
# after install: `systemctl show mosquitto -p Restart` must read always.
[Unit]
# T-6352: ~52 min of continuous failure (30 starts/h under the [Service] backoff) ends in
# ONE latched failed state (OnFailure alert where wired; failed_unit_reconcile sees it
# regardless) instead of an unbounded loop. Recover: reset-failed + start.
StartLimitIntervalSec=3600
StartLimitBurst=30

[Service]
Restart=always
RestartSec=5
# T-6352: exponential restart backoff (5,9,18,34,64,120s). NRestarts is cumulative
# (resets only on a manual start/restart), so 120s is also the steady per-crash delay.
RestartSteps=5
RestartMaxDelaySec=120
