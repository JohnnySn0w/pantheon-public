# Pantheon systemd-oomd opt-in for user.slice (T-2241, Option A — 2026-09-01).
#
# Agents live under user.slice: user-<UID>.slice/user@<UID>.service/app.slice/
# <agent>-telegram.service. Opting user.slice into oomd management means oomd
# watches the aggregate user-session pressure/swap and, when a threshold in
# oomd.conf.d/50-pantheon.conf is crossed, kills the descendant cgroup under the
# most pressure/swap — i.e. the single agent session driving the spike. That
# session's supervisor (claude-telegram*.service Restart / the auto-resume +
# handoff machinery) brings it back. One shed session, box preserved.
#
# Scope is deliberately user.slice ONLY (the agents). system.slice services
# (kino, ci-runner, tailscaled, journald) are left UNMANAGED here: they are
# either recoverable-by-restart second-order victims already accepted by the
# T-1927 shield, or infrastructure we do not want oomd targeting first. Widen to
# system.slice only with a separate, evidenced decision.

[Slice]
ManagedOOMSwap=kill
ManagedOOMMemoryPressure=kill
