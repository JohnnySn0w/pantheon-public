# Pantheon systemd-oomd: user.slice is deliberately NOT managed (T-5157, 2026-10-18;
# was ManagedOOM{Swap,MemoryPressure}=kill under T-2241 Option A, 2026-09-01).
#
# WHY: on systemd 255.4-1ubuntu8.18 + kernel 6.8 every oomd kill of a Claude pane
# scope SIGKILLs the processes and then returns -EINVAL: cg_kill's SIGKILL pass
# over cgroup.threads calls pidfd_open() on non-leader TIDs, which the kernel
# rejects (upstream fix "Don't use pidfds for pids from cgroup.threads" is not in
# any noble build). oomd_kill_by_{swap_usage,pgscan_rate} read the error as "not
# killed" and continue down the candidate list, so one user.slice-wide trigger
# killed a pane on EVERY seat account (21:04:37Z and 22:34:39Z 10-18).
#
# Shedding now lives in:
#   - user-.slice.d/50-pantheon-oomd.conf: per-account pressure kill on each
#     user-<UID>.slice (blast radius: one account; the EINVAL loop can still take
#     every pane in THAT account, e.g. recovery + deepseek-fallback together);
#   - earlyoom (tools/systemd/default/earlyoom): single-process memory/swap
#     backstop, which does not go through cg_kill and so avoids the bug;
#   - the kernel killer + T-1927 -850 shield as the last resort.
# Re-enable kill here only on a systemd build carrying the cgroup.threads fix.

[Slice]
ManagedOOMSwap=auto
ManagedOOMMemoryPressure=auto
