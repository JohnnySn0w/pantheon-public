# Pantheon systemd-oomd tuning (T-2241, Option A — 2026-09-01, operator-approved TG 6630).
#
# WHY: the 2026-07-28 incident was thrash-not-shed — a ~3GB transient spike
# arrived with no reserve, the box thrashed (%system 8→95%, %user collapsed)
# instead of shedding one session. The T-1927 OOM shield pins agent session
# leaders to oom_score_adj=-850 (kernel-killer protection), but that gives the
# *kernel* killer no clear victim, so it exhausts swap and thrashes. systemd-oomd
# is a PROACTIVE, PSI-based userspace shedder that kills the worst cgroup BEFORE
# the kernel thrash sets in — the missing "shed one, not the fleet" mechanism.
#
# oomd's victim selection is cgroup-PSI / cgroup-swap based and is ORTHOGONAL to
# oom_score_adj, so it composes with the -850 shield: oomd is the first-line
# proactive shedder; the -850 pins remain the kernel's last-resort backstop.
#
# These are CONSERVATIVE starting thresholds; the supervised first-fire validates
# they do not false-kill a healthy session under normal daily spikes. Reversible:
# `systemctl disable --now systemd-oomd` restores pre-oomd behavior exactly.

[OOM]
# Swap backstop: when system swap usage exceeds this, oomd kills the
# ManagedOOMSwap=kill descendant cgroup using the most swap. 90% is the systemd
# default — a late, unambiguous danger signal (this box: 90% ≈ 3.7GB of 4.0GB).
SwapUsedLimit=90%

# Memory-pressure detector (the actual 2026-07-28 fix): for a cgroup with
# ManagedOOMMemoryPressure=kill, if its memory PSI stays above this limit for the
# duration below, oomd kills the descendant under the most reclaim pressure —
# i.e. the session actually causing the spike — before the box thrashes.
# 60%/20s is conservative (the 2026-07-28 tail measured memory PSI some 74% /
# full 56%, so this would have fired). Raise the limit or lengthen the duration
# if the first-fire shows false-kills under normal transient spikes.
DefaultMemoryPressureLimit=60%
DefaultMemoryPressureDurationSec=20s
