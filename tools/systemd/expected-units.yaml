  - {unit: pantheon-echo-lint.service, enabled: false}
  # Shared echo cargo target prune, hourly with a size cap (T-4852, T-6121); installer-owned, not instanced
  - {unit: pantheon-echo-target-prune.timer, enabled: true}
  - {unit: pantheon-echo-target-prune.service, enabled: false}
  # CI-audit tip coverage: "THIS UNIT BELONGS ON THE `claude` SEAT AND ONLY THERE" (T-2440)
  - {unit: pantheon-ci-audit-tip-coverage.timer, enabled: true}
  - {unit: pantheon-ci-audit-tip-coverage.service, enabled: false}
  # hermes-audit dispatch (T-5354): gh workflow_dispatch, so claude-seat only. GitHub's cron is hours late.
  - {unit: pantheon-hermes-audit-dispatch.timer, enabled: true}
  - {unit: pantheon-hermes-audit-dispatch.service, enabled: false}
  # Nightly-CI red-run watch (T-4402): reads GitHub via gh, so claude-seat only. A watcher that
  # is merged but not enabled is the exact silent failure it exists to end.
  - {unit: pantheon-ci-nightly-watch.timer, enabled: true}
  - {unit: pantheon-ci-nightly-watch.service, enabled: false}
  # Decision-register sweep (T-5015 phase 2): reads the orchestrator seat's own session jsonls, so claude-seat only.
  - {unit: pantheon-decision-sweep.timer, enabled: true}
  - {unit: pantheon-decision-sweep.service, enabled: false}
  # Per-seat template pantheon-decision-sweep@.{service,timer} (T-5054): not expected anywhere yet; enabled per instance at install.
  # Throughline trigger (T-5015 phase 3): weekly; files one HO ticket when the register gained rows.
  - {unit: pantheon-decision-throughline.timer, enabled: true}
  - {unit: pantheon-decision-throughline.service, enabled: false}
  # Owner-side /tmp session prune, instanced by persona (T-6141); installer-owned, Claude seats except recovery
  - {unit: pantheon-tmp-session-prune@.service, enabled: false}
  - {unit: pantheon-tmp-session-prune@.timer, enabled: false}
  - {unit: pantheon-tmp-session-prune@orchestrator.timer, enabled: true}

