# tools/systemd/expected-units.yaml — which user units each seat is EXPECTED to carry (T-4232).
#
# Read by tools/systemd_drift_sweep.py (Recovery, daily). For every persona below, the sweep
# checks that persona's account's ~/.config/systemd/user and raises MISSING_EXPECTED (an
# alert, routed to Recovery triage) when a listed unit is:
#   - ABSENT: no installed unit file (for an instance `foo@bar.timer`, the template
#     `foo@.timer` or the literal instance file must be installed), or
#   - DISABLED: `enabled: true` but the unit name is not an entry in any `*.wants/` dir.
# `enabled: false` means presence-only (it does NOT mean "must be disabled"): use it for
# timer-driven oneshot services and for templates that are enabled per instance.
#
# Schema: persona -> list of {unit: <name>, enabled: true|false}. Personas are resolved to
# OS accounts via tools/agent_role_map.py (instance.yaml), never hard-coded here.
#
# Validation is FAIL-CLOSED: an unknown persona, a unit with no template in tools/systemd/,
# a bad key, or unparseable YAML makes the sweep alert MANIFEST_UNKNOWN; it never reads as
# "nothing expected". tools/test_systemd_drift_sweep.py loads this file in the suite, so
# removing a unit template without editing this list in the same change goes red.
#
# Removing an entry is a lifecycle decision (ORG-068): retire the unit and delete its line
# in the same PR. Detect + alert only — the sweep never installs or enables anything.
#
# Scope today (T-4232 D-4): the orchestrator seat's (claude) HO timers and recovery's
# (claude-fallback) units, per the seat headings in tools/systemd/README.md and unit-file
# comments. Other seats are not listed yet.

orchestrator:
  # ORG-013 cascade sweep (T-4186)
  - {unit: pantheon-cascade-sweep.timer, enabled: true}
  - {unit: pantheon-cascade-sweep.service, enabled: false}
  # pantheon-hermes-local-audit.{timer,service} (T-2392 stand-in): NOT expected — RETIRED
  # per orchestrator ruling 2026-09-29 (T-4232 live dry-run): no unit files on claude since
  # ~2026-08-03 and its README retire condition (tip-coverage COVERED) is met.
  # Fleet clone-currency check (T-2798)
  - {unit: pantheon-fleet-clone-currency.timer, enabled: true}
  - {unit: pantheon-fleet-clone-currency.service, enabled: false}
  # Echo-corpus obligation lint (T-3495)
