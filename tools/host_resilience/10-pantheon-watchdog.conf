# Pantheon host resilience (T-5237). Installed into /etc/systemd/system.conf.d/.
[Manager]
# PID 1 pings /dev/watchdog every half interval; if PID 1 stops answering for 5min the
# softdog resets the box. A false reset kills every session on the box and this 8 GB box has
# thrashed under OOM, so the margin is deliberately generous; a real PID 1 hang is still
# recovered in minutes.
RuntimeWatchdogSec=5min
# Bounds a hung shutdown/reboot: 10min covers slow seat and unit teardown.
RebootWatchdogSec=10min
