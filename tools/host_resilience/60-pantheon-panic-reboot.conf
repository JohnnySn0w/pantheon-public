# Pantheon host resilience (T-5237): a wedged kernel must reboot the box, not hang forever.
# Installed by tools/host_resilience/install.sh; removed by uninstall.sh.
#
# Reboot 10s after a panic (stock is 0 = hang forever).
kernel.panic = 10
# An oops is promoted to a panic, so it also ends in the reboot above.
kernel.panic_on_oops = 1
#
# DELIBERATELY NOT SET: kernel.softlockup_panic. On a KVM guest, host steal or a paused vCPU
# produces false soft-lockup reports, and each would hard-reboot the box.
# DELIBERATELY NOT SET: kernel.hung_task_panic. Heavy IO can leave a task in D-state past
# the 120s threshold on a healthy box, so panicking on it would cause false reboots.
