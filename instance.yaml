harness_runtime:
  schema: pantheon-harness-runtime/v1
  controller:
    tmux:
      session: "pantheon-{persona}"
      window: harness
      pane: "0"
    quota:
      weekly_remaining_percent: 5
  harnesses:
    claude:
      default_profile: interactive-subscription
      profiles:
        interactive-subscription:
          executable: "{account_home}/.npm-global/bin/claude"
          mode: interactive
          meter: subscription
          quota_source: statusline
        batch-sdk:
          executable: "{account_home}/.npm-global/bin/claude"
          mode: batch
          meter: sdk-credit
          quota_source: unavailable
    codex:
      default_profile: interactive-chatgpt
      profiles:
        interactive-chatgpt:
          executable: /usr/bin/codex
          mode: interactive
          meter: subscription
          quota_source: app-server
  roles:
    orchestrator:
      fallbacks:
        - codex/interactive-chatgpt
      tmux:
        session: claude-telegram-bot
      post_start:
        - command: ["{account_home}/pantheon-config/tools/arm_pane_log.sh", "{tmux_target}", "{persona}"]
        - command: ["{account_home}/pantheon-config/tools/recovery_boot_kick.sh", "{tmux_target}", "{persona}"]
          background: true
      claude:
        profile: interactive-subscription
        model: claude-opus-4-8
        native:
          permission_mode: default
          channels: plugin:telegram@claude-plugins-official
      codex:
        profile: interactive-chatgpt
        model: gpt-5.5
        permission_posture: full-auto
        execution_boundary: unrestricted
        mailbox_writable_roots:
          - kind: bound-mailbox
          - kind: persona-mailbox
            persona: codex
        native:
          config_overrides:
            model_reasoning_effort: high
    specialist:
      fallbacks:
        - codex/interactive-chatgpt
      # T-2633: CUTOVER COMPLETE -- pantheon-persona-consume@specialist.timer is ENABLED +
      # LIVE (verified 2026-08-10 via the enabled-timer symlink check). resolve_controller_config /
      # resolve_launch_config for role=specialist have exactly one production
      # caller (tools/persona_bringup.py, driven by that timer); nothing else
      # resolves this role at runtime -- only pantheon-persona-consume@%i.service's
      # ExecStart calls persona_bringup.py consume. (Was "dormant until fire" pre-cutover;
      # the persona_cutover.sh --persona specialist fire has since enabled the timer.)
      tmux:
        session: claude-research-bot
      post_start:
        - command: ["{account_home}/pantheon-config/tools/arm_pane_log.sh", "{tmux_target}", "{persona}"]
        - command: ["{account_home}/pantheon-config/tools/recovery_boot_kick.sh", "{tmux_target}", "{persona}"]
          background: true
      claude:
        profile: interactive-subscription
        model: claude-opus-4-8
        native:
          permission_mode: default
          channels: plugin:telegram@claude-plugins-official
          # T-3084: fleet effort policy (opus-4.8 @ xhigh). Retroactive fix --
          # specialist silently ran at CLI-default effort since HC cutover because
          # the adapter never wired native.effort into argv until this ticket.
          effort: xhigh
      # T-2927: codex/ChatGPT-sub fallback for the quota-gate swap (operator-directed
      # TG 7797/7799-7801). model gpt-5.5 (opus-rank equivalent, roster-verified 2026-08-12)
