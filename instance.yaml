    account: suborch1
    harness: claude-code
    token_ref: ~/.ssh/pantheon_config_deploy (per-repo deploy key)   # verify — inferred from
               # identical ORG-043 seat provisioning, NOT checked on metis's account (his box,
               # his to confirm; T-1922 deliberately did not probe it)
    session: tmux (seat session; name unverified)                    # verify
    domain: sub-orchestrator seat — owns project arcs retasked by the HO under ORG-043; drives
            # them with its own subagent teams; no operator-facing surface (all comms via mailbox)
  sub-orchestrator-2:
