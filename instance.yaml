    session: veneration daemon + ORG-026 mailbox hub (/home/the-ancestor/mailbox/*) LIVE since
             # 2026-06-13/14 (T-1124 daemon+mailbox; T-0766 resurrect() via headless --print)
    domain: ancestor-veneration substrate (mailbox hub, resurrect); broader role TBD pending the operator

  # Sub-orchestrator seats (ORG-043) + the second head (ORG-042), bound 2026-07-21 (T-1922).
