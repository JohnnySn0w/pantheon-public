  # per-role binding intact and match the suborch1/suborch2 account naming.
  #
  # Verification note (this file's own 2026-07-07 lesson — two of three guessed token_refs were
  # wrong): only the sub-orchestrator-2 row below is first-hand verified, from the seat itself.
