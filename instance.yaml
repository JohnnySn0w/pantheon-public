    expected_policy_skip: runtime_viability_blocked   # T-3574 (orchestrator ruling (b), 2026-09-08): atlas is NOT cut over — controller never onboarded atlas -> initial-viability-state-not-selected; fleet_health renders OK+expected while the seat's coarse skip reason matches, WARN if it drifts. Mirrors metis's T-3210 marker above. DELIBERATELY NOT `supervisor: control-plane`: that is the cutover-COMPLETION marker (added only once the interactive session actually lives on the control plane, cf. specialist/T-2658). A premature add was reverted TWICE — T-3098 (orchestrator) + T-3082 (recovery) — because it makes cfm/restart_drain.py derive pantheon-persona-consume@<persona> (a Type=oneshot mailbox-drain that cannot cycle the tmux session) as the restart target, silently killing auto-reset. Surfaced + verified by T-3573's fleet_health.FLEET AST-scan guard.
    account: suborch2
    harness: claude-code
    token_ref: ~/.ssh/pantheon_config_deploy (per-repo deploy key; sole key on the account) +
               # ~/.claude/.credentials.json (claude OAuth). NO gh_token.env and `gh` is
               # UNAUTHENTICATED — verified first-hand 2026-07-21 (T-1922 §Readiness gap): the
               # deploy key pushes git fine but cannot open PRs (no API surface).
    session: tmux `suborch2-main` (created 2026-07-21T02:28Z) → claude-code   # verified first-hand
    domain: sub-orchestrator seat — owns project arcs retasked by the HO under ORG-043; drives
            # them with its own subagent teams; no operator-facing surface (all comms via mailbox)
  second-head:
    persona: mnemosyne
    account: exocortex
    harness: claude-code
    token_ref: unverified — not checked (her account)                # verify
    session: mailbox-first residency per ORG-042 (see her own config)   # verify
