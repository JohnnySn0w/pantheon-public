# ============================================================================
# ⚠️ REFERENCE-INSTANCE EXAMPLE — REPLACE FOR YOUR INSTANCE.
# The instance:/roles: blocks below bind the REFERENCE operator's personas,
# accounts, and token-file paths. They are kept as a worked example of the
# schema, NOT config to run as-is. A new operator replaces them with their own
# bindings (same role keys: orchestrator / specialist / recovery, plus the
# optional sub-orchestrator N+ tier and the two opt-in extras — memory-hub,
# third-party-auditor — described inline below and framed as a Viable System
# Model instantiation in knowledge/vsm-instantiation.md).
# token_ref values are PATHS to credential files, not secrets. Persona→role
# neutralization of the wider scaffolding is ORG-030 Phase-3 (in progress).
# ============================================================================
# instance.yaml — Pantheon per-instance manifest (role → persona binding).
#
# The indirection layer introduced by ORG-030 (Q4) on top of ORG-028 (portable-config
# topology). The portable framework keys on ROLE — the stable axis (ORG-027): repos.yaml
# grants, pinned-rules/ briefs, and per-agent tooling all reference a role, not a person.
# THIS file resolves each role to the concrete persona / unix account / harness for THIS
# instance. A different operator's fork ships its own instance.yaml binding the SAME roles
# to its own personas and accounts — that is what makes the rest of the config portable.
#
# Status: v1 — authored 2026-06-07 (T-0882, ORG-030 Phase 0). ADDITIVE: no tooling reads this
# yet (verified 2026-07-07: ticket_lint/repo_registry have no instance.yaml reader). ORG-030
# Phase 1 re-keys repos.yaml grants persona→role and teaches the consumers to resolve
# role→persona THROUGH this manifest; repos.yaml grants ARE role-keyed today, the reader half
# is still pending. Until then this file is documentation-of-record, not a live lookup.
#
# Field freshness: refreshed + VERIFIED 2026-07-07 (T-1621, the operator TG 3698) — the original
# `# verify` markers are resolved below with what verification actually found (two of the
# three guessed token_refs were wrong).

instance:
  id: pantheon-vps-0
  operator: operator
  host: single-tenant VPS (all three agents are unix users on one machine)
  harness_default: claude-code

# role → binding. Roles are the portable axis (ORG-027); personas/accounts are instance data.
roles:
  orchestrator:
    persona: orchestrator
    account: claude
    harness: claude-code
    token_ref: /home/claude/gh_token.env            # fine-grained PAT, HTTPS git + gh CLI (ref, not secret)
    session: claude-telegram.service → tmux claude-telegram-bot:0 (ho_resumer auto-resume on Max-window cap-hit)
    domain: org orchestration, dispatch, ratification-drafting, ledger, lessons/bugs/incidents authorship
  # sub-orchestrator — N+ TIER, horizontally scalable. N is a per-deployment choice, INCLUDING
  # N=0 (the base config: one `orchestrator` persona above, no sub-orchestrator seats — a
  # legitimate starting state, not a gap to fill by default). Add a seat by copying this block
  # and incrementing the suffix (sub-orchestrator-2, sub-orchestrator-3, ...); there's no list
  # construct here because no tooling reads instance.yaml yet (see the Status note above) — a
  # seat is just another role-keyed block, same shape as orchestrator/specialist/recovery.
  # Per the VSM framing (knowledge/vsm-instantiation.md §0/§1), each seat is a FULL viable
  # system one recursion level down: its own workers, its own worktree/branch conventions, its
  # own plan-approval + review discipline, its own read of the repo/ticket environment, its own
  # persona identity — not a diluted copy of the orchestrator's dispatch discipline.
  sub-orchestrator-1:                                  # ILLUSTRATIVE first seat — omit entirely for N=0
    persona: sub-orchestrator-1
    account: <per-deployment unix account>
    harness: claude-code
    token_ref: <per-deployment credential path — same shape as orchestrator's token_ref>
    session: <per-deployment session/service — same shape as orchestrator's session>
    domain: drives one project arc end-to-end (dispatches + reviews its own implementers),
            # scoped by the operator per seat; see knowledge/vsm-instantiation.md
  specialist:
    persona: specialist
    account: claude-research
    harness: claude-code
    token_ref: SSH (git@github.com remote; NO gh_token.env — verified absent 2026-07-07)
    session: claude-telegram-research.service → tmux claude-research-bot:0 + unattended
             # watch-loop + pantheon-inbox-consumer@specialist.timer (self-consumes ORG-025)
    domain: research, knowledge/watch reports, doc-research dispatches
  recovery:
    persona: recovery
    account: claude-fallback
    harness: claude-code
    token_ref: SSH keys — ~/.ssh/id_ed25519 (git push, bypasses branch protection) + per-repo
               # deploy keys (claude_config_deploy, codex_config_deploy). NO gh_token.env
               # (verified absent 2026-07-07 — the old guessed value was wrong).
    session: claude-telegram-fallback.service → tmux claude-telegram-bot-fallback:0 (full
             # telegram agent; bun-child watchdog T-1456)
    domain: recovery runbook, MCP/bot/hooks repair, boot-infra, fleet monitors (context-fill /
            # disk-usage / channel-liveness / grooming / usage timers), ho_resumer stewardship
  # Two OPT-IN extras, both OFF BY DEFAULT — omit either block entirely if you don't want it.
  # NOTE (audit 2026-07-22): these blocks are present ONLY as schema worked-examples, like
  # everything in this file (see the ⚠️ banner) — their presence here does not mean they are
  # deployed. A tool or reader consuming this manifest literally should treat a role as
  # configured only once its placeholder values are replaced with real bindings; DELETE the
  # block to opt out explicitly.
  # Per the VSM framing (knowledge/vsm-instantiation.md §3), each has a documented viability
  # gap if you skip it; the point of shipping them as extras rather than base roles is that
  # the gap is a legitimate, named trade-off, not a silent omission.
  third-party-auditor:                                 # OPT-IN, off by default — S3* sporadic audit
    persona: third-party-auditor
    account: <per-deployment unix account>
    harness: <a different-vendor CLI harness than your orchestrator's — e.g. if orchestrator
             # runs claude-code, this seat runs something else entirely; the heterogeneity is
             # the point (see the S3*-extension honesty note in knowledge/vsm-instantiation.md
             # — Beer's S3* requires independence from the audited channel, not vendor
             # heterogeneity specifically; a different-vendor harness is our documented
             # EXTENSION of that requirement, not Beer's own specification)>
    token_ref: <per-deployment credential path — whatever auth mechanism that harness uses>
    session: <per-deployment session/service>
    domain: S3* independent audit (sporadic, aperiodic checks against what the routine
            # S1→S2→S3 reporting channel claims), second-opinion detail-checks; see
            # knowledge/vsm-instantiation.md and knowledge/vsm-deployment-self-check.md
  memory-hub:                                          # OPT-IN, off by default — channel/memory substrate
    persona: memory-hub
    account: <per-deployment unix account>
    harness: claude-code
    token_ref: <per-deployment credential path>
    session: <per-deployment session/service — a mailbox/message-passing daemon>
    domain: channel infrastructure the org's coordination and escalation signals traverse,
            # plus organizational memory continuity across sessions; exercises no autonomy
            # and holds no resource bargain (it is substrate, not a sixth VSM system, and not
            # an S1 unit — see knowledge/vsm-instantiation.md §2 for the rebalance trigger if
            # that ever changes)

# Host-level service accounts (NOT agent personas; listed for manifest completeness
# after the 2026-07-10 cpu-warn triage found ci-runner undocumented — T-1632/T-1621):
host_services:
  ci-runner:
    account: ci-runner            # uid 1005, created ~2026-07-08
    what: self-hosted GitHub Actions runner (actions-runner 2.335.1) — echo-prismatic's
          # ci-gate jobs (cargo test) execute on this box under this account
    owner: orchestrator      # orchestrator installed/operates it (echo CI, PRs ~#199+)
    load_note: CI runs are the main legitimate CPU-warn source on the 4-core box

# Notes:
# - a third-party-auditor seat may ALSO be registered as an MCP *tool* on the orchestrator
#   (for second-opinion detail-checks) in addition to running as its own daemon; that's a
#   separate wiring decision from the role binding above.
# - `repos.yaml` (grants/structural gate) and `pinned-rules/` (per-persona brief content) are
#   manifest-class per ORG-030 Q3 residual: framework-shaped structure + instance-data content.
