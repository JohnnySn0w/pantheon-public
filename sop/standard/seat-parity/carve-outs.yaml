  # ==================== mcp-python-package-pinned scope (T-3766 tranche 3) ====================
  # Recovery's post-re-seed audit surfaced that specialist/recovery/codex don't have a python
  # 'mcp' distribution installed at all — their MCP is the bun/TypeScript bridge
  # (recovery's telegram server.ts, specialist's mailbox MCP, codex's MCP-tool wrap).
  # The current mcp-python-package-pinned check assumes a python 'mcp' dist;
  # importlib.metadata returns absent → false → FAIL → 3 seats read BROKEN.
  # These are intentional-variants of the axis's INTENT (verify MCP setup so
  # lowlevel-Server decorators don't break at session start) — the intent is
  # python-mcp-specific; bun/TS MCPs don't have the lowlevel-Server decorator
  # bug at all. Carve out the 3 bun/TS-MCP seats.

  - seat: specialist
    axis: mcp-python-package-pinned
    verdict: intentional-variant
    rationale: >
      Specialist's MCP surface is bun/TS-based (mailbox MCP + telegram MCP), not
      python-mcp. The lowlevel-Server-decorator break that this axis pins
      against is a python-mcp-2.x-specific bug; the bun/TS MCPs don't share
      the surface, so pinning python-mcp<2 is a no-op for this seat. Recovery
      confirmed 2026-09-16-14 re-seed: importlib.metadata finds no 'mcp' dist.
    ratifier: sop/standard/pantheon-bringup.md-section-12
    ratified_date: 2026-09-16
    # T-3766 tranche 4 (2026-09-16): fixed role-id typo (was 'orchestrator-1'
    # which doesn't exist → CARVE_OUT_BROKEN per recovery's 2026-09-16-14 re-seed).
    # Real role_id for specialist is 'specialist'; harness is 'claude-code'.
    verifier: "instance.yaml roles.specialist.harness == 'claude-code'"
    review_trigger: "specialist adopts a python-mcp-consuming subsystem (e.g. mcp-python-adapter for a new MCP server) OR axes.yaml adds a bun/TS-MCP-recognizing check branch"

