# ORG-099 seat-parity carve-outs manifest
# Authoritative source for legitimate non-parity — a seat's exemption from an
# axis MUST be declared here or it counts as drift (per ORG-099 §4).
#
# Schema per carve-out:
#   seat            — persona name
#   axis            — axis_id from axes.yaml
#   verdict         — intentional-absence | intentional-variant | migration-in-progress | deferred
#   rationale       — one-paragraph WHY
#   ratifier        — operator-msg-ref | ADR-ref | ticket-ref that authorized this
#   ratified_date   — ISO date
#   verifier        — grepable/scriptable check that the carve-out is IN EFFECT
#                     (so a carve-out that has silently degraded also gets caught)
#   review_trigger  — event that would invalidate this carve-out
#
# Adding a HARD-axis carve-out requires operator-ratify (encodes what the fleet
# cares about). SOFT/BILLING/DOMAIN carve-outs matching existing verdicts are
# orchestrator-autonomous per feedback_infra_design_autonomous_with_corpus_check_msg10007.

