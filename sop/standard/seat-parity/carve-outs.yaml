      not python-mcp. Same reasoning as the specialist entry: the python-mcp-2.x
      lowlevel-Server bug this axis pins against doesn't apply to bun/TS MCPs.
      Recovery confirmed 2026-09-16-14 re-seed: importlib.metadata finds no 'mcp'
      dist.
    ratifier: sop/standard/pantheon-bringup.md-section-12
    ratified_date: 2026-09-16
    verifier: "instance.yaml roles.head-system-orchestrator.persona == 'recovery'"
    review_trigger: "recovery adopts a python-mcp-consuming subsystem OR axes.yaml adds a bun/TS-MCP-recognizing check branch"

